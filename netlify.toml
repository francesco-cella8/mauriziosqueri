# La chiave OpenRouter non sta qui.
# Su Netlify: Site configuration → Environment variables → OPENROUTER_API_KEY
# Ambito: Functions. Non usare il prefisso VITE_.
# Il controllo parte da controlla-novita.
#
# Il modulo «richiesta» è un Netlify Form.
# Form detection va lasciato attivo.
# Notifica email: Forms → Submission notifications → squeri.m@studiosqueri.com
# Il campo email del modulo diventa il Reply-To.
# Le richieste restano 24 mesi. Poi dimentica-richieste cancella la copia su Netlify.
# Su Netlify: Environment variables → NETLIFY_API_TOKEN
# Token personale con accesso ai form. Ambito: Functions. Non committarlo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."scrivi-novita"]
  background = true

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
